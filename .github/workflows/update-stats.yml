name: Update Profile Assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stats.yml
      - .github/scripts/generate_profile_assets.py
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is congested.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: update-profile-assets
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate profile assets
        env:
          GH_USERNAME: Fqih
          # Optional PAT; the script falls back to GITHUB_TOKEN when it
          # is missing, expired, or revoked.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate_profile_assets.py

      - name: Commit changed assets
        run: |
          git add svg/
          if git diff --staged --quiet; then
            echo "No asset changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git pull --rebase origin main
          git push
