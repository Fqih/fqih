<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 224' width='560' height='224' role='img' aria-labelledby='title desc' font-family="Poppins, 'Segoe UI', Roboto, sans-serif"><title>Contribution Streak</title><desc>Contribution streak summary from the GitHub contribution calendar.</desc><defs><linearGradient id='card-bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#171614'/><stop offset='100%' stop-color='#1B1916'/></linearGradient><pattern id='grid-minor' width='44' height='44' patternUnits='userSpaceOnUse'><path d='M 44 0 L 0 0 0 44' fill='none' stroke='rgba(255,255,255,0.03)' stroke-width='1'/></pattern><pattern id='grid-major' width='176' height='176' patternUnits='userSpaceOnUse'><rect width='176' height='176' fill='url(#grid-minor)'/><path d='M 176 0 L 0 0 0 176' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='1'/></pattern><filter id='soft-shadow' x='-10%' y='-10%' width='120%' height='130%'><feDropShadow dx='0' dy='8' stdDeviation='12' flood-color='rgba(0,0,0,0.28)' flood-opacity='1'/></filter><style>.frame{fill:url(#card-bg);stroke:#3B372F;stroke-opacity:.55;stroke-width:1;filter:url(#soft-shadow);}.surface{fill:#23211D;stroke:#3F3A33;stroke-opacity:.38;stroke-width:1;}.title{fill:#F4EFE7;font-size:22px;font-weight:700;letter-spacing:-.02em;}.subtitle{fill:#B7AEA1;font-size:12px;font-weight:400;}.eyebrow{fill:#B7AEA1;font-size:11px;font-weight:700;letter-spacing:.08em;}.value-xl{fill:#F4EFE7;font-size:30px;font-weight:700;letter-spacing:-.03em;}.value-lg{fill:#F4EFE7;font-size:18px;font-weight:700;letter-spacing:-.02em;}.hint{fill:#90877A;font-size:11px;font-weight:400;}.footer{fill:#90877A;font-size:11px;font-weight:400;}.body{fill:#F4EFE7;font-size:14px;font-weight:700;letter-spacing:-.01em;}.meta{fill:#B7AEA1;font-size:11px;font-weight:400;}.track{fill:#2D2923;}.grid{fill:url(#grid-major);opacity:.9;}.soft-badge{fill:#2D2923;}</style></defs><rect class='frame' x='0.5' y='0.5' width='559' height='223' rx='20'/><rect class='gr