<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 560 354' width='560' height='354' role='img' aria-labelledby='title desc' font-family="Poppins, 'Segoe UI', Roboto, sans-serif"><title>GitHub Overview</title><desc>Overview card generated from the GitHub GraphQL API.</desc><defs><linearGradient id='card-bg' x1='0' y1='0' x2='0' y2='1'><stop offset='0%' stop-color='#F7F3EB'/><stop offset='100%' stop-color='#F4F0E7'/></linearGradient><pattern id='grid-minor' width='44' height='44' patternUnits='userSpaceOnUse'><path d='M 44 0 L 0 0 0 44' fill='none' stroke='rgba(160,140,108,0.06)' stroke-width='1'/></pattern><pattern id='grid-major' width='176' height='176' patternUnits='userSpaceOnUse'><rect width='176' height='176' fill='url(#grid-minor)'/><path d='M 176 0 L 0 0 0 176' fill='none' stroke='rgba(160,140,108,0.10)' stroke-width='1'/></pattern><filter id='soft-shadow' x='-10%' y='-10%' width='120%' height='130%'><feDropShadow dx='0' dy='8' stdDeviation='12' flood-color='rgba(83,73,55,0.10)' flood-opacity='1'/></filter><style>.frame{fill:url(#card-bg);stroke:#E5DDD0;stroke-opacity:.55;stroke-width:1;filter:url(#soft-shadow);}.surface{fill:#FFFCF7;stroke:#ECE4D8;stroke-opacity:.38;stroke-width:1;}.title{fill:#1E1C19;font-size:22px;font-weight:700;letter-spacing:-.02em;}.subtitle{fill:#6D655A;font-size:12px;font-weight:400;}.eyebrow{fill:#6D655A;font-size:11px;font-weight:700;letter-spacing:.08em;}.value-xl{fill:#1E1C19;font-size:30px;font-weight:700;letter-spacing:-.03em;}.value-lg{fill:#1E1C19;font-size:18px;font-weight:700;letter-spacing:-.02em;}.hint{fill:#8B8173;font-size:11px;font-weight:400;}.footer{fill:#8B8173;font-size:11px;font-weight:400;}.body{fill:#1E1C19;font-size:14px;font-weight:700;letter-spacing:-.01em;}.meta{fill:#6D655A;font-size:11px;font-weight:400;}.track{fill:#EEE6DA;}.grid{fill:url(#grid-major);opacity:.9;}.soft-badge{fill:#EEE6DA;}</style></defs><rect class='frame' x='0.5' y='0.5' width='559' height='353' rx='20'/><rect class='grid' x='0.5' y='